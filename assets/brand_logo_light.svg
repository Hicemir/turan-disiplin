<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
        </filter>
    </defs>

    <!-- AMBLEM -->
    <g transform="translate(20, 10)">
        <!-- Dış Kalkan / Kurumsal Taban -->
        <path d="M 70 10 L 120 28 C 120 85 70 125 70 135 C 70 125 20 85 20 28 Z"
              fill="url(#shieldGrad)" filter="url(#shadow)" />

        <!-- İç Doküman / PDF Formu -->
        <path d="M 45 38 L 85 38 L 98 51 L 98 102 L 45 102 Z"
              fill="#ffffff" opacity="0.95" />

        <!-- Katlanan Sayfa Köşesi (PDF Efekti) -->
        <path d="M 85 38 L 85 51 L 98 51 Z" fill="#cbd5e1" />

        <!-- Otomatik Doldurulan Satırlar -->
        <rect x="53" y="58" width="34" height="4" rx="2" fill="#94a3b8" />
        <rect x="53" y="68" width="26" height="4" rx="2" fill="#94a3b8" />

        <!-- Onay / Kalem Ucu (Otomasyon Vurgusu) -->
        <path d="M 53 84 L 62 93 L 88 67"
              fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Üst Mini Taç / Başarı Yıldızı -->
        <circle cx="70" cy="22" r="3.5" fill="url(#goldGrad)" />
    </g>

    <!-- TİPOGRAFİ / METİN -->
    <g transform="translate(170, 0)">
        <!-- TURAN -->
        <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="46" font-weight="900" fill="#0f172a" letter-spacing="2">
            TURAN
        </text>

        <!-- DİSİPLİN -->
        <text x="180" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="46" font-weight="400" fill="#0284c7" letter-spacing="1">
            DİSİPLİN
        </text>

        <!-- SLOGAN / AÇIKLAMA -->
        <text x="2" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="14" font-weight="600" fill="#64748b" letter-spacing="3.5">
            OKUL EVRAK &amp; PDF OTOMASYONU
        </text>

        <!-- Alt Vurgu Çizgisi -->
        <rect x="2" y="124" width="70" height="3" rx="1.5" fill="url(#goldGrad)" />
    </g>
</svg>
